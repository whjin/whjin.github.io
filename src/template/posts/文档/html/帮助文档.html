      <noscript><div class="markdown-content viewer" style="padding:1em"><h3><code>Prettier</code> 注释指令对 <code>Markdown</code> 选定内容不格式化</h3>
<ol>
<li><strong>忽略单个代码块</strong>
在代码块前一行添加 <code>&lt;!-- prettier-ignore --&gt;</code> 注释</li>
</ol>
<pre><code class="language-javascript">&lt;!-- prettier-ignore --&gt;
// 这段代码会保持原样，不会被Prettier格式化
const   messyCode   =   {   a: 1,   b: 2   };
</code></pre>
<ol start="2">
<li><strong>忽略多行/整个区域</strong>
使用 <code>&lt;!-- prettier-ignore-start --&gt;</code> 和 <code>&lt;!-- prettier-ignore-end --&gt;</code> 包裹需要忽略的内容</li>
</ol>
<pre><code class="language-javascript">&lt;!-- prettier-ignore-start --&gt;
这部分内容
    会完全保持原样
        包括缩进和换行
都不会被Prettier修改

# 这个代码块也会被忽略
print(   &quot;hello&quot;   )
&lt;!-- prettier-ignore-end --&gt;
</code></pre>
<ol start="3">
<li><p><strong>忽略整个 <code>Markdown</code> 文件</strong>
在项目根目录创建 <code>.prettierignore</code> 文件，并添加 <code>*.md</code></p>
<p><strong>忽略代码块内的特定语言</strong></p>
<p>只想禁用代码块内某一种语言的格式化，保留其他语言的格式化，可以在 <code>.prettierrc</code> 配置文件中添加：</p>
</li>
</ol>
<pre><code class="language-json">{
  &quot;overrides&quot;: [
    {
      &quot;files&quot;: &quot;*.md&quot;,
      &quot;options&quot;: {
        &quot;embeddedLanguageFormatting&quot;: &quot;off&quot;
      }
    }
  ]
}
</code></pre>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
  <script>
    (function () {
      // 运行时从相邻 .md 渲染：md 改动后刷新即更新；保留预渲染正文作为 no-JS / 爬虫回退
      var mdUrl = '../%E5%B8%AE%E5%8A%A9%E6%96%87%E6%A1%A3.md';
      function finish() {
        try {
          if (typeof generateTOC === 'function') generateTOC();
          // markedHighlight 已在 handler 内完成代码高亮，此处不再重复 hljs.highlightElement，
          // 否则 highlight.js 会把已高亮的 <span> 误判为未转义 HTML 而触发安全告警。
          document.querySelectorAll('#markdown-content a').forEach(function (a) {
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener noreferrer');
          });
        } catch (e) {}
        if (window.adsbygoogle) (window.adsbygoogle = window.adsbygoogle || []).push({});
        if (typeof hideLoading === 'function') hideLoading();
      }
      try {
        if (typeof handler === 'function') {
          handler('markdown-content', mdUrl, finish);
        } else {
          finish();
        }
      } catch (e) { finish(); }
    })();
  </script>
