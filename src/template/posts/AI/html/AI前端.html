      <noscript><div class="markdown-content viewer" style="padding:1em"><h2>模型侧</h2>
<ul>
<li><code>LLM</code> （大语言模型）</li>
<li><code>fine-tuning</code></li>
<li><strong>模型微调</strong>：成本较高，灾难性遗忘</li>
<li><strong>多模态</strong>：输入：图片、音视频 输出：富媒体内容</li>
<li><strong>模型效果评测</strong>：AI Code 实现场景（实现一个电商网站，是否有登录、是否有购物车），核心评测手段，依靠人工来评测</li>
<li>模型部署优化（模型压缩）</li>
<li>数据蒸馏</li>
<li><strong>推理加速优化</strong>：核心方法，模型提前按照高频的使用场景（<code>query</code>词）生成好模板</li>
</ul>
<h2>工程侧</h2>
<ul>
<li>领域能力 webview的IDE应用 LSP</li>
<li>上下文管理</li>
<li><strong>提示词工程</strong>：通过指令的方式，规范化模型的输出，让模型的回复（处理效果）更符合预期</li>
<li><code>multi agent</code>：工程分治的思想，<code>planner agent</code>原始输入拆解为每一个工作节点和流程</li>
<li><code>MCP（Function call）</code>：<code>Model Control Protocal</code> Web应用，接口调用后，写入交易的记录，定义了一套标准的通讯协议</li>
<li><code>Agent client</code></li>
</ul>
<h2>前端工程提效</h2>
<p>通过AI实现前端研发工作流程中的自动化，减少研发成本</p>
<ul>
<li><code>AI Code Review</code>：<code>trigger gitlab webhooks</code>，接口<ol>
<li>除基座模型外，有没有自身的一些业务规范和必须遵守的代码规范 知识库</li>
<li>获取代码的 <code>diff</code> 本身是否包含全部代码上下文</li>
</ol>
</li>
<li>AI自动化工作流：核心技术方案<ol>
<li><code>browser-use</code> 让大模型可以读懂浏览器内的页面</li>
<li><code>playwright/puppeteer</code> 无头浏览器 让大模型具备操作网页的能力</li>
</ol>
</li>
</ul>
<h2>AI编程方向</h2>
<p>指标体系，AI出码率：AI生成的代码总行数 / <code>commit</code> 代码总行数</p>
<p><strong>AI编程助手</strong></p>
<p>TDD Test-Drive
KDD Knowledge-Drive</p>
<p>D2C 设计稿转码</p>
<p>生成基础的 <code>HTML/CSS</code> 通用组件 -&gt; 业务组件</p>
<p>让AI读懂设计稿 获取组件库知识 实现一个 <code>Agent</code> 处理 设计稿出代码</p>
<p><strong>生成式UI（AI原生UI）</strong></p>
<ol>
<li>面向用户侧：根据不同的上下文环境，直接生成不同的可交互页面/组件</li>
<li>研发侧：生产提效</li>
</ol>
<p>两种方式：</p>
<ol>
<li>完全生产：大模型返回 <code>HTML/CSS</code>，<code>iframe</code>、微前端、<code>webview</code> 把AI生成的组件渲染用用户界面</li>
<li><code>Google A2UI</code>：AI生成的 <code>lowcode schema</code> <code>UI=F(state) A2UI UI=F(state) + AI(UI)</code></li>
</ol>
<p><strong>知识库</strong></p>
<ol>
<li><code>AI Coding</code>(<code>vibe coding</code>、<code>spec coding</code>)</li>
<li>设计稿转码</li>
<li>AI IDE 建设（主流前端IDE都是 <code>webview</code>）<ol>
<li>IDE AI Agent 需要大量和用户运行环境交互的能力</li>
<li>Cursor已经可以集成 <code>browser-like</code>方案，让AI可以感知Web运行是状态</li>
</ol>
</li>
<li>自动化测试</li>
</ol>
<p><strong>核心观点</strong></p>
<ol>
<li>前端主流工作内容会以人机协作的形态共存（<code>coding -&gt; promt + coding共存</code>）</li>
<li>核心岗位能力要求上，会更偏重于「创造性」和「问题解决」</li>
</ol>
<h2>AI前端工程</h2>
<ol>
<li>基础知识<ol>
<li><code>LLM</code>、<code>context</code>、<code>Agent</code>、<code>Function call</code>、<code>MPC</code>、<code>embedding</code>等AI工程落地相关必备的基础知识</li>
</ol>
</li>
<li><code>MPC</code><ol>
<li><code>MCP</code>协议详解 <code>MCP Client/Server</code> 实现原理</li>
</ol>
</li>
<li>知识库<ol>
<li>向量数据库</li>
<li><code>embedding</code></li>
</ol>
</li>
<li>主流 <code>AI Agent</code> 架构<ol>
<li><code>ReAct</code></li>
<li><code>Plan-and-Execute</code></li>
<li><code>Multi-Agent</code></li>
<li><code>AI workflow</code></li>
</ol>
</li>
<li>AI前端工程实践：通过 <code>MCP</code> + 合理AI架构，解决实际的工程问题</li>
</ol>
<h3>AI全栈工程</h3>
<p>组件化思维、工程化能力和用户体验敏感度。端到端构建可落地的 <code>AI</code> 应用。</p>
<p><strong><code>AI能力集成</code> -&gt; 后端服务开发 -&gt; 前端交互设计 -&gt; 部署上线 -&gt; 监控迭代</strong> 全流程开发。</p>
<h3>技能图谱</h3>
<p><strong>第一优先级：<code>AI</code> 应用层核心技能</strong></p>
<!-- prettier-ignore-start -->
<table>
<thead>
<tr>
<th>技能模块</th>
<th>核心知识点</th>
<th>学习重点</th>
</tr>
</thead>
<tbody><tr>
<td><strong>大模型基础原理</strong></td>
<td><code>Transformer</code>架构、上下文窗口、<code>Token</code> 计算、温度系数、<code>Top-P</code> 采样</td>
<td>理解“大模型如何生成文本”，重点掌握参数对输出的影响</td>
</tr>
<tr>
<td><strong>提示工程（<code>Prompt Engineering</code>）</strong></td>
<td>结构化提示、思维链（<code>CoT</code>）、少样本学习、角色设定、提示词优化</td>
<td><code>AI</code> 应用开发的“第一语言”，积累提示词库</td>
</tr>
<tr>
<td><strong>检索增强生成（<code>RAG</code>）</strong></td>
<td>文档加载 -&gt; 分块 -&gt; 向量化 -&gt; 向量存储 -&gt; 检索 -&gt; 重排序 -&gt; 生成</td>
<td><code>AI</code> 全栈的核心技术，企业级 <code>AI</code> 应用都基于 <code>RAG</code> 构建</td>
</tr>
<tr>
<td><strong>函数调用（<code>Function Calling</code>）</strong></td>
<td>工具定义、参数解析、多工具调用、错误处理</td>
<td>让大模型“能做事”而非“能说话”的关键，是 <code>Agent</code> 开发的基础</td>
</tr>
<tr>
<td><strong><code>Agent</code> 开发</strong></td>
<td>规划能力、记忆系统、工具使用、多 <code>Agent</code> 写作</td>
<td>下一代 <code>AI</code> 应用的主流形态</td>
</tr>
</tbody></table>
<!-- prettier-ignore-end -->

<p><strong>第二优先级：编程能力扩展</strong></p>
<ol>
<li><code>Python</code> 基础<ul>
<li>核心语法：变量、数据类型、函数、类、异常处理</li>
<li>常用库：<code>requests</code> （<code>API</code> 调用）、<code>pandas</code>（数据处理）、<code>numpy</code>（数值计算）</li>
</ul>
</li>
<li><code>typeScript</code> 深化<ul>
<li>强化：泛型、类型体操、异步编程（<code>Promise/async-await</code>）</li>
<li>重点掌握：流式数据处理（<code>ReadableStream</code>）、<code>Web Worker</code>（多线程）、<code>Service Worker</code>（后台线程）</li>
</ul>
</li>
</ol>
<p><strong>第三优先级：<code>AI</code> 全栈后端技能</strong></p>
<ol>
<li>后端框架<ul>
<li><code>FastAPI</code>（首选）：<code>Python</code> 生态最火的 <code>AI</code> 后端框架，自动生成 <code>API</code> 文档，性能优异，与 <code>LangChain</code> 等 <code>AI</code> 库无缝集成</li>
<li><code>NestJS</code>（备选）：<code>TypeScript</code>编写，<code>Node.js</code> 框架</li>
</ul>
</li>
<li>数据库<ul>
<li>传统数据库：<code>PostgreSQL</code>（支持向量扩展 <code>pgvector</code>，一库多用）</li>
<li>向量数据库：<code>Chroma</code>（轻量本地）、<code>Pinecone</code>（云服务）、<code>Milvus</code> （开源企业级）</li>
</ul>
</li>
<li>中间件<ul>
<li>消息队列：<code>Redis</code>（简单场景）、<code>RabbitMQ</code>（复杂场景）</li>
<li>缓存：<code>Redis</code>（缓存大模型响应、向量检索结果）</li>
<li>文件处理：<code>PDF</code> 解析（<code>PyPDF2</code>、<code>LangChain</code> 文档加载器）、<code>Excel</code> 解析（<code>pandas</code>）</li>
</ul>
</li>
</ol>
<p><strong>第四优先级：前端 <code>AI</code> 技能</strong></p>
<ul>
<li><strong>流式输出实现</strong>：使用 <code>fetch</code> + <code>ReadableStream</code> 实现打字机效果，处理中断与错误</li>
<li><strong><code>AI</code> 交互组件</strong>：聊天界面、文件上传、进度条、思考过程展示</li>
<li><strong>多模态交互</strong>：语音输入（<code>Web Speech API</code>）、语音输出（<code>Web Speech Synthesis</code>）、图片上传与预览</li>
<li><strong>前端 <code>AI</code> 推理</strong>：使用 <code>Transformer.js</code> 在浏览器中运行小模型（如 <code>Llama 3 8B</code> 量化版）</li>
<li><strong><code>AI</code> 组件库</strong>：<code>Vercel AI SDK</code>、<code>shadcn/ui AI</code> 组件、<code>LangChain JS</code></li>
</ul>
<p><strong>第五优先级：工程化部署</strong></p>
<ul>
<li><strong>容器化</strong>：写 <code>Dockerfile</code> 和 <code>docker-compose.yml</code> 配置文件</li>
<li><strong>云服务</strong>：<code>Vercel</code> （前端 + <code>Next.js</code> 全栈一键部署）</li>
<li><strong>模型部署</strong>：<code>Ollama</code>（本地部署开源模型）、<code>vLLM</code> （高性能推理）</li>
<li><strong>监控与运维</strong>：日志收集(<code>ELK Stack</code>)、错误监控 <code>Sentry</code>、大模型调用监控 <code>LangSmith</code></li>
<li><strong>安全</strong>：<code>API</code> 密钥管理、<code>Prompt</code> 注入防护、数据脱敏、限流与鉴权</li>
</ul>
<h3>实战项目</h3>
<ol>
<li><code>RAG</code> 全流程：文档加载 -&gt; 分块 -&gt; 向量化 -&gt; 向量存储 -&gt; 检索 -&gt; 重排序 -&gt; 渲染生成</li>
<li>向量数据库：掌握 <code>Chroma</code>、<code>Pinecone</code> 的使用，理解向量检索的基本原理</li>
<li>函数调用：学习 <code>Function Calling</code>，能让大模型调用外部工具</li>
<li><code>FastAPI</code>：学习 <code>FastAPI</code>，能编写简单的 <code>AI</code> 后端服务</li>
<li><code>LangChain JS/Python</code>：掌握 <code>LangChain</code>的核心概念（链、工具、代理、<code>Memory</code>）</li>
</ol>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
