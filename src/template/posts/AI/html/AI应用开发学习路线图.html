<h2>五、实战项目建议</h2>
<h3>5.1 项目难度分级</h3>
<h4>🟢 初级项目（适合阶段 1-2）</h4>
<p><strong>1. 个人博客系统</strong></p>
<ul>
<li><strong>技术栈</strong>：Next.js + Markdown + Vercel</li>
<li><strong>功能</strong>：文章 CRUD、评论系统、标签分类</li>
<li><strong>学习点</strong>：SSR/SSG、Markdown 解析、SEO 优化</li>
<li><strong>扩展</strong>：添加 AI 自动生成摘要功能</li>
</ul>
<p><strong>2. 待办事项应用</strong></p>
<ul>
<li><strong>技术栈</strong>：React + Node.js + MongoDB</li>
<li><strong>功能</strong>：任务管理、提醒通知、分类筛选</li>
<li><strong>学习点</strong>：CRUD 操作、状态管理、RESTful API</li>
<li><strong>扩展</strong>：AI 智能排序优先级</li>
</ul>
<p><strong>3. 天气预报应用</strong></p>
<ul>
<li><strong>技术栈</strong>：Vue + OpenWeather API</li>
<li><strong>功能</strong>：城市搜索、7 天预报、天气图表</li>
<li><strong>学习点</strong>：第三方 API 集成、数据可视化</li>
<li><strong>扩展</strong>：AI 穿衣建议</li>
</ul>
<hr>
<h4>🟡 中级项目（适合阶段 3-4）</h4>
<p><strong>4. 智能文档问答系统</strong></p>
<ul>
<li><strong>技术栈</strong>：Next.js + FastAPI + Pinecone + LangChain</li>
<li><strong>功能</strong>：PDF 上传、文档索引、自然语言问答</li>
<li><strong>学习点</strong>：RAG 架构、向量搜索、文档处理</li>
<li><strong>挑战</strong>：提高检索准确率、处理长文档</li>
</ul>
<p><strong>5. AI 代码助手</strong></p>
<ul>
<li><strong>技术栈</strong>：VS Code Extension + OpenAI API</li>
<li><strong>功能</strong>：代码补全、代码解释、Bug 修复建议</li>
<li><strong>学习点</strong>：AST 解析、Extension 开发、Prompt 工程</li>
<li><strong>挑战</strong>：上下文管理、响应速度优化</li>
</ul>
<p><strong>6. 智能客服机器人</strong></p>
<ul>
<li><strong>技术栈</strong>：React + Node.js + Rasa/OpenAI</li>
<li><strong>功能</strong>：多轮对话、意图识别、人工转接</li>
<li><strong>学习点</strong>：对话管理、NLU、会话状态跟踪</li>
<li><strong>挑战</strong>：处理边界情况、提升用户体验</li>
</ul>
<hr>
<h4>🔴 高级项目（适合阶段 5-6）</h4>
<p><strong>7. AI 研究助手</strong></p>
<ul>
<li><strong>技术栈</strong>：Next.js + LangGraph + Serper API + Arxiv API</li>
<li><strong>功能</strong>：<ul>
<li>自动搜索相关论文</li>
<li>提取关键信息并总结</li>
<li>生成结构化研究报告</li>
<li>多 Agent 协作（搜索 Agent + 分析 Agent + 写作 Agent）</li>
</ul>
</li>
<li><strong>学习点</strong>：Agent 编排、并行任务、结果整合</li>
<li><strong>挑战</strong>：任务分解、错误恢复、质量控制</li>
</ul>
<p><strong>8. 个性化学习平台</strong></p>
<ul>
<li><strong>技术栈</strong>：React + Python + PostgreSQL + Redis</li>
<li><strong>功能</strong>：<ul>
<li>用户知识水平评估</li>
<li>个性化学习路径推荐</li>
<li>AI 生成练习题与解析</li>
<li>学习进度追踪与分析</li>
</ul>
</li>
<li><strong>学习点</strong>：推荐算法、自适应学习、数据分析</li>
<li><strong>挑战</strong>：冷启动问题、推荐准确性、用户留存</li>
</ul>
<p><strong>9. 企业知识库平台</strong></p>
<ul>
<li><strong>技术栈</strong>：Next.js + FastAPI + Weaviate + OAuth</li>
<li><strong>功能</strong>：<ul>
<li>多源数据接入（Notion、Slack、Google Drive）</li>
<li>统一语义搜索</li>
<li>权限管理与审计</li>
<li>多租户支持</li>
<li>使用分析与优化</li>
</ul>
</li>
<li><strong>学习点</strong>：系统集成、RBAC、可观测性、规模化</li>
<li><strong>挑战</strong>：数据同步、权限继承、性能优化</li>
</ul>
<hr>
<h3>5.2 项目展示建议</h3>
<p><strong>GitHub Repository</strong>：</p>
<ul>
<li>✅ 清晰的 README（项目介绍、技术栈、安装步骤、演示截图）</li>
<li>✅ 良好的代码结构</li>
<li>✅ 单元测试覆盖</li>
<li>✅ CI/CD 配置</li>
<li>✅ Live Demo 链接</li>
</ul>
<p><strong>个人作品集网站</strong>：</p>
<ul>
<li>展示 3-5 个最佳项目</li>
<li>包含项目背景、技术挑战、解决方案、成果指标</li>
<li>提供在线演示或视频 walkthrough</li>
</ul>
<p><strong>技术博客</strong>：</p>
<ul>
<li>记录学习过程和项目经验</li>
<li>分享遇到的问题和解决方案</li>
<li>建立个人技术品牌</li>
</ul>

<h3>A. 常用工具速查</h3>
<p><strong>开发工具</strong>：</p>

<h3>B. 常见陷阱与建议</h3>
<p><strong>AI 应用开发</strong>：</p>
<ol>
<li>❌ 过度依赖 LLM，不做输入验证<ul>
<li>✅ 始终验证和清理用户输入</li>
</ul>
</li>
<li>❌ 忽略 Token 成本<ul>
<li>✅ 实施缓存、压缩 Prompt、监控用量</li>
</ul>
</li>
<li>❌ 没有评估机制<ul>
<li>✅ 建立自动化评估流程</li>
</ul>
</li>
<li>❌ 忽视延迟问题<ul>
<li>✅ 使用流式响应、预计算、缓存</li>
</ul>
</li>
</ol>
<p><strong>全栈开发</strong>：</p>
<ol>
<li>❌ 过早优化<ul>
<li>✅ 先实现功能，再优化性能</li>
</ul>
</li>
<li>❌ 忽略安全性<ul>
<li>✅ 始终考虑认证、授权、数据加密</li>
</ul>
</li>
<li>❌ 不写测试<ul>
<li>✅ 至少覆盖核心业务逻辑</li>
</ul>
</li>
<li>❌ 文档缺失<ul>
<li>✅ 维护 README 和 API 文档</li>
</ul>
</li>
</ol>
<h3>C. 学习心态建议</h3>
<ol>
<li><strong>接受不确定性</strong> - AI 领域变化快，保持开放心态</li>
<li><strong>实践胜过理论</strong> - 多做项目，少刷教程</li>
<li><strong>循序渐进</strong> - 不要试图一次性掌握所有技术</li>
<li><strong>寻求帮助</strong> - 善用社区、文档、AI 助手</li>
<li><strong>持续反思</strong> - 定期回顾学习进度和调整方向</li>
<li><strong>享受过程</strong> - 编程和创造本身应该是有趣的</li>
</ol>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
