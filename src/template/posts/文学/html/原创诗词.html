      <noscript><div class="markdown-content viewer" style="padding:1em"><h1>蓝色盛夏</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/A8T7hdxPEj">视频号</a>
<a href="https://b23.tv/Sqe7qeC">B站</a>
<a href="https://www.douyin.com/video/7637172087225185402">抖音</a>
<a href="https://v.kuaishou.com/KZ3SPpx1">快手</a>
<a href="http://xhslink.com/o/87H9Do07WPc">小红书</a> <hr></p>
<p>蓝色盛夏，热浪裹青帐，山昏影更长。<br>泉水倚清涧，兰舟穿荷塘，绿荷如擎盖，芙蓉比高洁。<br>好风有劲意，欺云赶雨不停息。<br>吹皱一池淡墨，流远一行柔波，拂起千叶霓裳甚风情。<br>石阶轻弹珍珠落，回廊闻香挂雨帘。<br>三三两两，闲叙一二，不止良辰好景，更有赏心乐事。<br>山色空蒙笼烟纱，泼染水洗如画。<br>云销雨霁，明月均分千家院，一种情思谁家窗，点滴在心间。<br>最是酣梦能消除，无念且无主。</p>
</blockquote>
<h1>少年锦时</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/ArRB5WSUxY">视频号</a>
<a href="https://b23.tv/EjKw62U">B站</a>
<a href="https://www.douyin.com/video/7638809372457920101">抖音</a>
<a href="https://v.kuaishou.com/K8ZIf1U8">快手</a>
<a href="http://xhslink.com/o/GMBuXzfvB3">小红书</a> <hr></p>
<p>北江之畔，山峦秀丽，川流清冽，风物俱美，人杰地灵。<br>性情随和，乐于助人，喜文艺，好旅行摄影。<br>下笔千言，不知所云，但洒潘江，各倾陆海。<br>好读书，不求甚解，文艺气息浓重。<br>诗词歌赋，古今中外皆有涉猎。<br>远足爬山，观览风景，适闲心性，趣意盎然。<br>对美有极致追求，简洁明快，自然而生。<br>不喜喧闹，不近人群，享受孤独。<br>爱独游，亦喜呼朋引伴，多为风物美食倾倒。<br>尤爱周庄水韵，山麓的清流，美哉，快哉。<br>一箪食一瓢饮，甚是辛酸。<br>从来不着文笔墨，到头尽是虚妄，叹叹叹。<br>庄周梦蝶，锦瑟年华，乐得一世逍遥，好不自在。<br>鲲鹏展翅九万里，志在南海，极目千里，壮阔无边。<br>也道是一蓑烟雨任平生，人生如梦，一樽还酹江月。</p>
</blockquote>
<h1>水脉洗春芳</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/Ajpen1jxVt">视频号</a>
<a href="https://b23.tv/GqCYlsA">B站</a>
<a href="https://www.douyin.com/video/7639205789266186469">抖音</a>
<a href="https://www.kuaishou.com/f/X-aEW6J6IhV2XWTY">快手</a>
<a href="http://xhslink.com/o/36G7jep9mgI">小红书</a> <hr></p>
<p>水脉洗春芳，草已盛，花也繁。<br>池鱼逐波浪，燕鹊筑新房。<br>佳节临近，暖阳正待，登高望远，无限风光。<br>林深悠远，曲径通幽。<br>清泉滑过青苔，涧户寂静无人。<br>鸡唱晓，鸟欢腾。<br>露水拔力着根迹，松果无端作别离。<br>山竹高挺，春笋贯列，花娇树茂，风和日丽。<br>穿林汲水浇园圃，平地圈栏养鸡鹅。<br>三两处浣衣闲谈话家常。<br>旨趣不言深，晨炊起，收拾心情，迎佳节。</p>
</blockquote>
<h1>又见新春</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/AAAYksdcYi">视频号</a>
<a href="https://b23.tv/RMs9vt6">B站</a>
<a href="https://www.douyin.com/video/7664624109086575915">抖音</a>
<a href="https://v.kuaishou.com/Jk3kgcLw">快手</a>
<a href="http://xhslink.com/o/6Ofe7mPPKIM">小红书</a> <hr></p>
<p>是春有新月，满庭芳。<br>窗下盆兰，平时随洒一瓢饮，护得幽兰次第开。<br>一度风烈凛凛，一度雨肥漫漫，今年似旧年。<br>石阶曲径行人往，荷莲残叶换新装。<br>藕香熬煮，勾起邻人味痴，品尝。<br>乡野有春意，处处笑开颜，志在家老欢欣。<br>黄鹂啭啼引朋伴，围园逐草风露餐。<br>彩扇扑扑，水暖花鲜，山桃一夜开遍。<br>殷红更胜粉颊，飞燕自娇羞，缱绻枝头理容妆。<br>池鱼游弋，鸳鸟戏水，流远一行柔波。<br>朗月如玉，纤云锦绣，皱起万顷清辉。<br>一树正挂心愿，神思早已飞驰。<br>风摇酒香迷醉，最是一时良辰，楼檐灯起。<br>银盘缀起百花鲜，这般院落，静如传声密语。<br>是春有新月，又见满庭芳。</p>
</blockquote>
<h1>月落风荷咏</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/APRSnwxCQU">视频号</a>
<a href="https://b23.tv/DA2FI9N">B站</a>
<a href="https://www.douyin.com/video/7660377444424543205">抖音</a>
<a href="https://v.kuaishou.com/ntu24SMR">快手</a>
<a href="http://xhslink.com/o/4nXvoejRRvW">小红书</a> <hr></p>
<p>临近七夕，佳节将至，暑气未消，蝉鸣鸟噪，人来人往，不亦乐乎。<br>天高地阔，水天一色，阴云密布，狂风大作，大雨滂沱。<br>雨落如注，雨帘如瀑，雨滴如珠，叶之纷飞如舞，花之零落成泥。<br>一时熙熙攘攘，一时寂寞萧索，暮色染窗镜，华灯起氤氲，雨势渐停，饥声频频，大快朵颐。<br>正是饭余闲散有意趣，旧景如昨，华庭错落，赏心乐事游园时。<br>清丽和风送，娇柔花香来，残叶覆夏草，颓垣现秋苔。<br>紫荆相暌违，红樱遍地栽，新月长空净，芙蓉荷塘清。<br>莲人玉立三生世，粉颊如雪质如冰，相见多莞尔，返照笑可盈。<br>流波声寂寂，岸柳影重重，浮光映月露华浓，蟾宫桂树生繁茂，古来骚客几多情？<br>无端情绪相依偎，人面桃花都不见，今年却与去年同，月落风荷咏。</p>
</blockquote>
<h1>月咏</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/AHFQxDi6dQ">视频号</a>
<a href="https://b23.tv/ldaaO6i">B站</a>

<a href="http://xhslink.com/o/26wxPjQs3rN">小红书</a> <hr></p>
<p>月是仙娥居桂宫<br>月是离人相守望<br>月是渔火照江津<br>月是锦书凭雁传<br>月是雪肌洁如玉<br>月是明眸清似水<br>月是冰蕊飘香径<br>月是繁星相依伴<br>月是繁花同绮丽<br>月是琴瑟长和鸣<br>月是如镜水盈盈<br>月是如影舞频频<br>月是如梦总关情<br>月是皎皎白海棠<br>月是姝姝金芙蓉<br>月是桃园起芬芳<br>月是兰圃露华浓<br>月是锦书何所寄<br>月是锦瑟何所惜<br>月是锦心长相忆<br>月是夭桃施粉黛<br>月是河洛意徘徊<br>月是伊人直可待<br>月是晴光满心怀<br>月是庭兰香馥郁<br>月是窗竹满清音<br>一见如故，一念如慕，最是倾心</p>
</blockquote>
<h1>仲秋记事</h1>
<p>作者：吴华锦</p>
<blockquote>
<p>视频地址：
<a href="https://weixin.qq.com/sph/AcRYRZaSXo">视频号</a>
<a href="https://b23.tv/nCYljO5">B站</a>
<a href="https://www.douyin.com/video/7646621258205939897">抖音</a>

<a href="http://xhslink.com/o/386uCe1vZ9f">小红书</a> <hr></p>
<p>台风天，闲来无事，胡乱写一首。<br>算去往来时光，犹是志得意满少年郎。<br>那年秋季，隔窗相望大地风雷雨。<br>想今日，归家啖茶闲谈有风趣。<br>可谓是，景随心动，意随心转。<br>偷闲写诗弹词笑声满天际。<br>狂风起，转陀螺，水跳滴秋禾。<br>金黄满地滚波浪，油绿流水漫花床。<br>灯飘摇，点明灭，窗镜洗风荷。<br>闲里鸣歌声细细，好景入梦，一望山川正好。<br>佳期远近，念得白头如新，倾盖如故。<br>不识人间多自在，惯看山花山木秋风起。<br>一时光彩潇洒夺人目，却是流长细水总犹记。<br>回首，再回首，静里青毡安枕熟睡有心意。</p>
</blockquote>

<h1>江南烟雨春</h1>
<p>作者：吴华锦</p>
<blockquote>

<p>春天到了，和风日丽，鸟叫欢喜。<br>吃过早饭，浇了花，准备着明日启程的行装。<br>窗外草已盛，花正香，欲把晴光漫洒入心房。<br>纸上写了千万言，心中藏着一首歌。<br>充分发出光和热，产生一种温暖。<br>开怀大笑的时候，收获一种感动。<br>时光流转，花月摇摆，星辰灿烂。<br>风很凉，呼吸欢畅，披上缀着七彩流苏的外套。<br>忆起节日里玫瑰的浓香，花竹灯笼美丽的笑容。<br>院落里种着花草和各色植物，像在家里一样。<br>远处未融化的雪山，笼着雾霭，一片洁白。<br>山麓错落的房子，围坐着一群欢乐孩子。<br>熟稔地把食物一块一块递到嘴边。<br>慢慢地嚼，慢慢地咽，慢慢地喝下一口水。<br>来时准备了当地的调子，随意地哼着。<br>跟人打着招呼，像极了吴侬软语话家常。<br>在别致的清流里，浮光绚烂出彩，安静出常。<br>没有晓风残月和长亭归舟，有执手相看。<br>千种风情，献与这般好景良辰，一声声。<br>莫在风尘里荡漾，也不要孤芳自赏。<br>把你晶莹剔透的心，轻轻安放，待岁月静好。<br>在绿草如茵的午后，牵着手，一起度过美好时光。<br>穿过潺潺溪流和茂盛松林，听见阵阵悠扬的歌声。</p>
