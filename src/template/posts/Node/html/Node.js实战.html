      <noscript><div class="markdown-content viewer" style="padding:1em"><h1>全栈图书管理系统</h1>
<blockquote>
<p>项目地址：<a href="https://github.com/whjin/node-galaxy/tree/master/book-management-system">book-management-system</a></p>
</blockquote>
<blockquote>
<ol>
<li>完整项目的需求分析和架构设计（需求规划、目录结构设计、接口设计）</li>
<li>后端接口开发和数据库设计（<code>Express</code> + <code>MongoDB</code> 开发接口，设计数据模型，认证授权）</li>
<li>前后端联调方法和解决跨域问题（<code>Apifox</code> 测试接口，<code>cors</code>和代理解决跨域问题）</li>
<li>项目部署流程，使用 <code>PM2</code> 管理应用进程（搭建服务器环境、上传项目、<code>PM2</code> 启动、管理项目）</li>
<li>项目优化与迭代（性能优化、功能扩展）</li>
</ol>
</blockquote>
<h2>一、需求分析</h2>
<p><strong>1. 功能规划：分角色、分模块</strong></p>
<ul>
<li><strong>公共功能</strong>：用户注册、用户登录（<code>JWT</code>认证）、图书借阅（模糊查询、分类查询）</li>
<li><strong>管理员功能</strong>：图书管理（添加、修改、删除图书）、借阅管理（查看借阅记录、审核借阅申请）、用户管理（查看用户列表、禁用用户）</li>
<li><strong>普通用户功能</strong>：个人中心（修改个人信息、查看借阅记录）、图书借阅、图书归还</li>
</ul>
<p><strong>2. 技术栈</strong></p>
<ul>
<li><strong>后端</strong>：<code>Node.js</code>、<code>Express</code>、<code>MongoDB</code>、<code>JWT</code>、<code>CORS</code></li>
<li><strong>前端</strong>：<code>HTML</code>、<code>CSS</code>、<code>JavaScript</code>、<code>Bootstrap</code></li>
<li><strong>工具</strong>：<code>Apifox</code>、<code>PM2</code></li>
</ul>
<h2>二、项目架构设计</h2>
<p><strong>1. 目录结构设计</strong></p>
<!-- prettier-ignore-start -->
<pre><code class="language-markdown">book-management-system/
├── client/
│ ├── css/
│ ├── index.html
│ └── js/
└── server/
├── config/         # 配置文件(数据库配置、JWT配置等)
├── controller/     # 控制器(处理请求、返回响应)
├── middleware/     # 中间件(认证、异常处理、跨域)
├── model/          # 数据模型（MongoDB 集合定义）
├── route/          # 路由（接口地址定义）
├── utils/          # 工具函数（密码加密、JWT 生成/验证）
├── app.js
└── package.json
</code></pre>
<!-- prettier-ignore-end -->

<p><strong>2. 模块划分</strong></p>
<ul>
<li><strong>用户模块</strong>：负责用户注册、登录、个人信息修改（对应 <code>controller</code>、<code>route</code>、<code>model</code> 的 <code>user</code> 相关文件）</li>
<li><strong>图书模块</strong>：负责图书的增删改查（对应 <code>book</code> 相关文件）</li>
<li><strong>借阅模块</strong>：负责图书借阅、归还、借阅记录查询（对应 <code>borrow</code> 相关文件）</li>
<li><strong>公共模块</strong>：负责配置、中间件、工具函数（全局通用）</li>
</ul>
<p><strong>3. 接口设计</strong></p>
<!-- prettier-ignore-start -->
<table>
<thead>
<tr>
<th>接口地址</th>
<th align="center"><center>请求方式</center></th>
<th>功能描述</th>
<th>请求参数</th>
</tr>
</thead>
<tbody><tr>
<td><code>api/user/register</code></td>
<td align="center"><code>POST</code></td>
<td>用户注册</td>
<td><code>username</code>、<code>password</code>、<code>email</code></td>
</tr>
<tr>
<td><code>api/user/login</code></td>
<td align="center"><code>POST</code></td>
<td>用户登录</td>
<td><code>username</code>、<code>password</code></td>
</tr>
<tr>
<td><code>api/book/list</code></td>
<td align="center"><code>GET</code></td>
<td>查询图书列表</td>
<td><code>page</code>、<code>size</code>、<code>keyword</code></td>
</tr>
<tr>
<td><code>api/book/add</code></td>
<td align="center"><code>POST</code></td>
<td>添加图书（管理员）</td>
<td><code>title</code>、<code>author</code>、<code>price</code>、<code>category</code></td>
</tr>
<tr>
<td><code>api/borrow/apply</code></td>
<td align="center"><code>POST</code></td>
<td>借阅图书</td>
<td><code>bookId</code>、<code>userId</code></td>
</tr>
</tbody></table>
<!-- prettier-ignore-end -->

<h2>三、后端开发</h2>
<p><strong>1. 数据库设计</strong></p>
<p><strong>2. 接口实现</strong></p>
<p><strong>3. 认证授权</strong></p>
<p><strong>4. 异常处理</strong></p>
<h2>四、前后端联调</h2>
<p><strong>1. 接口测试</strong></p>
<p><strong>2. 解决跨域问题</strong></p>
<h2>五、项目部署</h2>
<p><strong>1. 服务器环境搭建</strong></p>
<p><strong>2. 项目打包</strong></p>
<p><strong>3. <code>PM2</code> 进程管理</strong></p>
<pre><code class="language-sh">// 1. 启动项目
pm2 start app.js --name &quot;book-system&quot;

// 2. 查看项目运行状态
pm2 list

// 3. 重启项目
pm2 restart &quot;book-system&quot;

// 4. 停止项目
pm2 stop &quot;book-system&quot;

// 5. 查看项目日志
pm2 logs &quot;book-system&quot;

// 6. 设置PM2 开机启动（关键，服务器重启后自动启动项目）
pm2 startup
pm2 save
</code></pre>
<h2>六、项目优化与迭代</h2>
<p><strong>1. 性能优化</strong></p>
<ul>
<li>数据库优化：给常用字段（<code>username</code>、<code>title</code>）添加索引，查询速度翻倍</li>
<li>接口优化：减少不必要的数据库查询，查询图书列表，只返回需要的字段</li>
<li>静态资源优化：前端静态资源（<code>CSS</code>、<code>JS</code>、图片）压缩，减少加载时间</li>
</ul>
<p><strong>2. 功能扩展</strong></p>
<ul>
<li>新增图书分类功能：给图书添加多级分类，方便用户查询</li>
<li>新增借阅提醒功能：用户借阅图书后，到期前发送提醒（<code>nodemailer</code> 模块）</li>
<li>新增评论功能：用户可以给图书评论、打分</li>
<li>优化前端页面：用 <code>Vue</code>、<code>React</code> 框架重构前端，提升用户体验</li>
</ul>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
