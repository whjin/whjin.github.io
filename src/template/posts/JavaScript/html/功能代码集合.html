<h2>日期格式化</h2>
<pre><code class="language-JavaScript">// 格式化日期类型,fmt格式可选择
function dateFormat(fmt, date) {
  let ret;
  let opt = {
    &quot;Y+&quot;: date.getFullYear().toString(), // 年
    &quot;M+&quot;: (date.getMonth() + 1).toString(), // 月
    &quot;D+&quot;: date.getDate().toString(), // 日
    &quot;h+&quot;: date.getHours().toString(), // 时
    &quot;m+&quot;: date.getMinutes().toString(), // 分
    &quot;s+&quot;: date.getSeconds().toString(), // 秒
    &quot;ms+&quot;: date.getMilliseconds().toString() // 毫秒
  };
  for (let k in opt) {
    ret = new RegExp(&quot;(&quot; + k + &quot;)&quot;).exec(fmt);
    if (ret) {
      fmt = fmt.replace(ret[1], ret[1].length == 1 ? opt[k] : opt[k].padStart(ret[1].length, &quot;0&quot;));
    }
  }
  return fmt;
}
let date = new Date();
let fDate = dateFormat(&quot;YYYY-MM-DD hh:mm:ss.ms&quot;, new Date(date));
</code></pre>

<h2>时间转换（秒数转时分秒）</h2>
<pre><code class="language-JavaScript">function timeFormat (sec) {
    let minite = Math.floor((sec / 60 % 60)) &lt; 10 ? &#39;0&#39; + Math.floor((sec / 60 % 60)) : Math.floor((sec / 60 % 60));
    let second = Math.floor((sec % 60)) &lt; 10 ? &#39;0&#39; + Math.floor((sec % 60)) : Math.floor((sec % 60));
    if (sec &lt; 3600) {
        return `${minite}:${second}`;
    } else {
        let hour = Math.floor(sec / 3600) &lt; 10 ? &#39;0&#39; + Math.floor(sec / 3600) : Math.floor(sec / 3600);
        return `${hour}:${minite}:${second}`;
    }
}
</code></pre>
<h2>计算时分秒差值</h2>
<pre><code class="language-JavaScript">// 计算时分秒差值
function timeDiffer(beginTime, endTime) {
  let ret = {};
  let date = new Date();
  let sTime = Date.parse(dateFormat(&quot;YYYY/MM/DD&quot;, date) + &quot; &quot; + beginTime);
  if (beginTime &gt;= endTime) {
    date.setDate(date.getDate() + 1);
  }
  let eTime = Date.parse(dateFormat(&quot;YYYY/MM/DD&quot;, date) + &quot; &quot; + endTime);
  let differ = eTime - sTime;
  let hour = Math.floor(differ / 1000 / 60 / 60);
  let minute = Math.floor(differ / 1000 / 60 - hour * 60);
  let second = Math.floor(differ / 1000 - hour * 60 * 60);
  ret = {
    differHour: hour,
    differMinute: minute,
    differSecond: second
  };
  return ret;
}
let { differHour, differMinute, differSecond } = timeDiffer(beginTime, endTime);
</code></pre>

function deepCopy(obj) {

<pre><code class="language-javascript">// ES6最简方法
let result = [];

// filter去重
function unique(arr) {
  return arr.filter((item, index, arr) =&gt; {
    // 当前元素在原数据中的第一个索引等于当前索引值，否则返回当前元素
    return arr.indexOf(item, 0) == index;
  });
}

// 数组去重
function unique(arr) {
  if (!Array.isArray(arr)) {
    return;
  }
  let result = [];
  for (let i = 0; i &lt; arr.length; i++) {
    if (result.indexOf(arr[i]) === -1) {
      result.push(arr[i]);
    }
  }
  return result;
}
function unique(arr) {
  if (Array.isArray(arr)) {
    let result = [];
    for (let i = 0, len = arr.length; i &lt; len; i++) {
      if (!result.includes(arr[i])) {
        result.push(arr[i]);
      }
    }
    return result;
  }
}

<h2>计算传入时间与当前时间相差的秒数</h2>
<pre><code class="language-javascript">function convertStrToTime(time) {
  let nowTime = new Date().getTime();
  let date = new Date();
  let arr = time.split(&#39;:&#39;);
  date.setHours(parseInt(arr[0]));
  date.setMinutes(parseInt(arr[1]));
  let endTime = new Date(date).getTime();
  let ret = Math.ceil((endTime - nowTime) / 1000);
  return ret;
}

<h2>获取本周所有日期</h2>
<pre><code class="language-js">export const getWeekDate = () =&gt; {
  let weekDateList = [];
  let weeks = [&#39;星期一&#39;, &#39;星期二&#39;, &#39;星期三&#39;, &#39;星期四&#39;, &#39;星期五&#39;, &#39;星期六&#39;, &#39;星期日&#39;];

  let today = new Date();
  let currentDay = today.getDay();
  let monday = new Date(today);
  monday.setDate(today.getDate() - ((currentDay + 6) % 7));
  for (let i = 0; i &lt; 7; i++) {
    let currentDate = new Date(monday);
    currentDate.setDate(monday.getDate() + i);
    let formatDate = dateFormat(&#39;MM-DD&#39;, new Date(currentDate));
    let weekDate = `${formatDate} ${weeks[i]}`;
    weekDateList.push(weekDate);
  }
  return weekDateList;
};
</code></pre>

    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
