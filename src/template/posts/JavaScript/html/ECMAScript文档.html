      <noscript><div class="markdown-content viewer" style="padding:1em"><h2>1. <code>var</code>、<code>let</code>、<code>const</code>之间的区别</h2>
<ul>
<li><code>var</code>：<ul>
<li>声明变量可以重复声明</li>
<li>不受限于块级</li>
<li>会跟 <code>window</code> 相映射</li>
<li>声明上方访问变量</li>
</ul>
</li>
<li><code>let</code>：<ul>
<li>不可以重复声明</li>
<li>受限制于块级</li>
<li>暂存死区</li>
</ul>
</li>
<li><code>const</code>：<ul>
<li>声明后必须赋值</li>
<li>常量，不能修改</li>
</ul>
</li>
</ul>
<h2>2. <code>ES6 Module</code> 与 <code>CommonJS</code>核心区别</h2>
<!-- prettier-ignore-start -->
<table>
<thead>
<tr>
<th><strong>特性</strong></th>
<th><strong><code>CommonJS</code></strong></th>
<th><strong><code>ES6 Module</code></strong></th>
</tr>
</thead>
<tbody><tr>
<td>加载时机</td>
<td>运行时同步加载</td>
<td>编译时静态加载</td>
</tr>
<tr>
<td>导出特性</td>
<td>值的拷贝（修改原变量不影响导出）</td>
<td>值的只读引用（原变量修改会同步）</td>
</tr>
<tr>
<td>静态分析</td>
<td>不支持（无法 <code>tree-shaking</code>）</td>
<td>支持（可移除未使用代码）</td>
</tr>
<tr>
<td>浏览器支持</td>
<td>不原生支持</td>
<td>原生支持（<code>&lt;script type=&quot;module&quot;&gt;</code>）</td>
</tr>
<tr>
<td>循环依赖</td>
<td>加载到哪里导出哪里</td>
<td>同样支持，但可能得到 <code>undefined</code></td>
</tr>
<tr>
<td>顶层 <code>this</code></td>
<td>指向 <code>module.exports</code></td>
<td>指向 <code>undefined</code></td>
</tr>
</tbody></table>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
