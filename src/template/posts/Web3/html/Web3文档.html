      <noscript><div class="markdown-content viewer" style="padding:1em"><h2>技术路线</h2>
<blockquote>
<p><code>React + TypeScript + Viem + Wagmi + Foundry + Scaffold-ETH2</code> (<code>2026</code>年行业标准栈)</p>
</blockquote>
<p><strong>合约开发</strong></p>
<ol>
<li>数据类型中拷贝方法判定</li>
<li>合约上下文变量</li>
<li><code>ABI</code>数据、接口与函数调用的底层逻辑</li>
<li>函数调用机制中的过滤器链条模型</li>
<li>委托调用与代理模式</li>
<li>线性化、<code>super</code>关键字与虚函数覆盖</li>
</ol>
<p><strong>实战项目</strong></p>
<ol>
<li>应用合约开发中 <code>openzeppelin</code>合约库</li>
<li>钱包与应用的状态管理</li>
<li>通过访问合约构建 <code>DAPP</code>业务逻辑</li>
<li>使用 <code>web3</code>基础设施，特别是去中心化存储支持功能开发</li>
<li>与生态的关系处理</li>
<li>基本的经济设计方法</li>
</ol>
<h2>Web3基础</h2>
<p>1、基础密码学
哈希函数、公钥密码学、数字签名、默克尔树</p>
<p>比特币使用<code>SHA-256</code>哈希函数，产生<code>256</code>为（<code>32</code>字节）哈希值</p>
<p>公钥密码学-非对称加密</p>
<p>椭圆曲线密码学-比特币<code>secp256k1</code>和以太坊使用，数字签名算法（<code>ECDSA</code>）</p>
<p>数字签名-证明交易是由私钥持有者发起</p>
<p>默克尔树-哈希树，二叉树，高效验证大量数据的完整性</p>
<p>2、比特币
去中心化、共识机制、区块链结构</p>
<p>3、区块链类型
公有链、私有链和联盟</p>
<p>4、Web3存储协议
<code>IPFS</code>、<code>Filecoin</code></p>
<p>5、应用场景
跨境支付、资产数字化/代币化、<code>DeFi</code>（去中心化金融）、<code>DAO</code>组织、预测市场、数字存证/防伪、NFT/数字艺术品、游戏</p>
<p>6、实操
创建钱包、发送交易、与<code>DApp</code>交互、参与<code>DeFi</code>、购买<code>DNF</code></p>
<h2>以太坊虚拟机</h2>
<p>以太坊虚拟机 <code>EVM</code> 是智能合约的运行环境。沙盒封装、完全隔离，在 <code>EVM</code> 中运行代码无法访问网络、文件系统和其他进程。</p>
<h3>账户</h3>
<p>以太坊有两类账户（共用同一个地址空间）：<strong>外部账户</strong>由公钥-私钥对控制；<strong>合约账户</strong>由和账户一起存储的代码控制。</p>
<p>每个账户都有一个键值对形成的持久化存储。其中 <code>key</code> 和 <code>value</code> 的长度都是 <code>256</code> 位（<strong>存储</strong>）。</p>
<p>每个账户有一个以太币余额 <code>balance</code>（单位 <code>Wei</code>），余额会因为发送包含以太币的交易而改变。</p>
<h3>交易</h3>
<p>从一个账户发送到另一个账户的消息，包含一个二进制数据（合约负载）和以太币。</p>
<p>如果目标账户含有代码，此代码会被执行，并以 <code>payload</code> 作为入参。</p>
<p>如果目标账户是零账户（账户地址位 <code>0</code>），此交易将创建一个 <strong>新合约</strong>。合约地址不是 <code>0</code> 地址，通过合约创建者的地址和从该地址发送过的交易数量计算得到（<code>nonce</code>）。</p>
<p>这个用来创建合约的交易的 <code>payload</code> 会被转换为 <code>EVM</code> 字节码并执行。执行的输出将作为合约代码被永久存储。</p>
<p>创建一个合约，不需要发送实际的合约代码，而是发送能够产生合约代码的代码。</p>
<h3><code>Gas</code></h3>
<p>一经创建，每笔交易都收取一定数量的 <code>Gas</code>，目的是限制执行交易所需要的工作量和为交易支付手续费。<code>EVM</code> 执行交易时，<code>Gas</code> 将按特定规则逐渐耗尽。</p>
<p><code>gas price</code> 是交易发送者设置的一个值，发送者账户需要预付的手续费为 <code>gas_price * gas</code>。</p>
<p><code>gas</code> 被耗尽，将会触发 <code>out-of-gas</code> 异常，当前调用帧 <code>call frame</code>所做的所有状态修改都会被回滚。</p>
<h3>存储，内存和栈</h3>
<p>每个账户有一块持久化内存区称为 <strong>存储</strong>。存储是将 <code>256</code> 位字映射到 <code>256</code> 位字的键值存储区。</p>
<p>第二个内存区称为 <strong>内存</strong>，合约会试图为每一次消息调用获取一块干净的内存实例。内存是线性、可按字节级寻址，读的长度限制 <code>256</code> 位，写长度 <code>8</code> 位或 <code>256</code> 位。</p>
<p><code>EVM</code> 所有的计算都在 <strong>栈</strong> 的区域执行，栈最大有 <code>1024</code> 个元素，每个元素长度是一个字 <code>256</code> 位。</p>
<p>对栈的访问只限于其顶端，限制方式：允许拷贝最顶端的 <code>16</code> 个元素中的一个到栈顶，或交换栈顶元素和下面 <code>16</code> 个元素中的一个。所有其他操作都只能取最顶的两个元素，运算后把结果压入栈顶。</p>
<h3>指令集</h3>
<p><code>EVM</code> 指令集量应尽量少以最大限度避免可能导致共识问题的错误实现。所有指令都是针对 <strong><code>256</code>位的字 <code>word</code></strong> 基本数据进行操作。</p>
<h3>消息调用</h3>
<p>合约通过消息调用来调用其他合约或发送以太币到非合约账户。消息调用有一个源、目标、数据、以太币、<code>Gas</code> 和返回数据。</p>
<p>合约可以决定在内部的消息调用中，对于剩余的 <code>gas</code> 应发送和保留多少。在内部消息调用时发生 <code>out-of-gas</code> 异常，将由一个被压入栈顶的错误值所指明。只有与该内部消息调用一起发送的 <code>gas</code> 会被消耗掉。</p>
<h3>委托调用/代码调用和库</h3>
<p><strong>委托调用 <code>delegatecall</code></strong> 目标地址和代码将在发起调用的合约的上下文中执行，并且 <code>msg.sender</code> 和 <code>msg.value</code> 不变。一个合约可以再运行时从另一个地址动态加载代码。存储、当前地址和余额都指向发起调用的合约，只有代码是从被调用地址获取。</p>
<h3>日志</h3>
<p><strong>日志 <code>logs</code></strong> 可索引的数据结构，存储的数据可以一路映射直到区块层级，用这个特性实现 <strong>事件 <code>event</code></strong>。</p>
<p>部分日志数据被存储在 <strong>布隆过滤器 <code>Bloom Filter</code></strong> 中，可以高效且加密安全地搜索日志，没有下载整个区块链的网络节点也可以找到这些日志。</p>
<h3>创建</h3>
<p>合约可以通过一个特殊的指令来创建其他合约。创建合约的调用 <code>create calls</code> 负载会被执行，执行的结果被存储为合约代码，调用者/创建者在栈上得到信合约的地址。</p>
<h3>自毁</h3>
<p>合约代码从区块链上移除的唯一方式是合约在合约地址上执行自毁操作 <code>selfdestruct</code>。合约账户上剩余的以太币会发送给制定的目标，然后其存储和代码从状态中被移除。</p>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
