      <noscript><div class="markdown-content viewer" style="padding:1em"><blockquote>
<p><code>Solidity</code>面向合约、为实现智能合约而创建的高级编程语言。受到了 <code>C++</code>，<code>Python</code> 和 <code>JavaScript</code> 语言的影响，设计的目的是能在以太坊虚拟机（<code>EVM</code>）上运行。<br><code>Solidity</code> 是静态类型语言，支持集成、库和复杂的用户定义类型等特性。</p>
</blockquote>
<h1>智能合约</h1>
<p>关键字 <code>pragma</code> (编译指令)是告知编译器如何处理源代码的指令。<code>Solidity</code> 中的合约就是一组代码和数据，它们位于以太坊区块链的一个特定地址上。</p>
<p>所有的标识符（合约名、函数名和变量名）都只能使用 <code>ASCII</code> 字符集。<code>UTF-8</code> 编码的数据可以用字符串变量的形式存储。</p>
<h2>数据类型</h2>
<h3>值类型 <code>value type</code></h3>
<ul>
<li>整数 枚举 布尔 <code>address</code> <code>contract</code> <code>fixed-size byte array</code></li>
</ul>
<h4><code>integer(int/uint)</code></h4>
<ul>
<li>以 <code>8</code> 位字长递增</li>
<li>对于整形数类型 <code>x</code>，可以用 <code>type(x)min()</code>和 <code>type(x)max()</code>取这个类型的最大值或最小值</li>
<li>以太坊虚拟机是 <code>256</code>位的机器</li>
<li>低版本取模，高版本：抛出异常 <code>SafeMath</code></li>
</ul>
<h4><code>enum type</code></h4>
<ul>
<li>枚举是用户创建自定义类型的一种方法 <code>contract</code> <code>struct</code> <code>enum</code></li>
<li>可以与整形数显式转换（隐式不行）</li>
<li>整形到枚举的转换会检查是否越界</li>
<li>枚举最少一个成员，最多 <code>256</code>个成员（<code>uint8</code>），默认值是第一个成员</li>
<li>从 <code>0</code>开始的无符号整形数</li>
</ul>
<h4><code>address</code></h4>
<ul>
<li><code>20</code>个字节长度</li>
<li>关于可支付：<ul>
<li><code>address payable</code>可支付，有成员函数 <code>transfer</code>和 <code>send</code></li>
<li><code>address payable</code>可转换为 <code>address</code>，反之需要显式转换</li>
<li>可转换为 <code>unit160</code>和 <code>bytes20</code></li>
<li>合约账户地址与外部账户地址 <code>EOA External Owner Account</code></li>
<li><code>call</code> <code>balance</code> 很大程度上 <code>address</code>并不只是一个数据类型</li>
</ul>
</li>
</ul>
<h4><code>contract</code></h4>
<ul>
<li>合约可以隐式转换为它的父合约（多态）</li>
<li>可以显式转换为地址类型 <code>address</code></li>
<li>不支持任何运算符</li>
<li>从合约变量（实例）调用合约函数</li>
<li>可用 <code>new</code>操作符部署另一合约</li>
</ul>
<h4><code>fiexed-size byte array</code></h4>
<ul>
<li>从 <code>bytes1</code>到 <code>bytes32</code></li>
<li>通过下标访问元素</li>
<li>通过 <code>length</code>读取长度</li>
</ul>
<h3>引用类型 <code>reference type</code></h3>
<ul>
<li>数组 <code>struct</code> <code>mapping</code></li>
<li>引用类型，变量本身域变量指向的数据块分离，赋值操作是引用拷贝，数据块不受影响</li>
<li>通常的面向对象语言中所有引用类型变量之间赋值操作，都是引用拷贝</li>
<li>这一点在 <code>solidity</code>的引用类型中不再成立：<code>solidity</code>的引用类型的变量之间可能发生值拷贝</li>
</ul>
<h4><code>location</code></h4>
<ul>
<li><code>EVM</code>从三个地方访问数据：<code>memory</code> <code>storage</code> <code>calldata</code>，这三个地方就是变量的 <code>location</code></li>
<li><code>calldata</code>实际上是 <code>Transation</code>的数据字段</li>
</ul>
<h4>数组<code>array</code></h4>
<ul>
<li>与 <code>location</code>不同，完全是两种类型</li>
<li><code>storage</code>和 <code>memory</code>中的动态数组</li>
<li>数组元素的类型限制</li>
</ul>
<h4>结构 <code>struct</code></h4>
<ul>
<li>结构如同 <code>contract</code>和 <code>enum</code>，用来自定义数据类型</li>
<li>状态变量、局部变量、参数与返回值均可用结构</li>
<li>结构可放在 <code>mapping</code>和数组中，结构的成员可以是 <code>mapping</code>或数组</li>
</ul>
<h4>映射 <code>mapping</code></h4>
<ul>
<li>声明形式：<code>mapping(key type=&gt;value type)</code> <code>mapping(string=&gt;uint8) ages;</code> <code>mapping(string =&gt; uint8) storage _ages = ages;</code></li>
<li><code>keytype</code>可以是任何基本类型，包括 <code>bytes</code>和 <code>string</code>，不包括用户自定义的复杂类型——合约、枚举、结构、映射</li>
<li><code>value type</code>可以是包括 <code>mapping</code>在内的任何类型</li>
<li>可以作为状态变量、<code>storage</code>型局部变量、库函数的参数；不能作为共有函数的参数或返回值</li>
<li><code>public</code>的 <code>mapping</code>会自动生成 <code>getter</code>；嵌套的 <code>mapping</code>生成的 <code>mapper</code>会有多个参数</li>
<li><code>mapping</code>无法遍历 <code>storage layout</code></li>
<li><code>public</code>函数参数或返回值不可能出现 <code>mapping</code>类型</li>
</ul>
<h2>合约函数</h2>
<p><code>function fname</code>（[参数]）[可见性][交易相关] <code>returns</code>(返回值) <code>{}</code></p>
<ul>
<li>函数签名：<code>fname</code>(参数)</li>
<li>返回值：<code>returns</code>(返回值)</li>
</ul>
<h3>函数可见性</h3>
<p>默认值变化 <code>private</code> <code>public</code> <code>internal</code> <code>external</code></p>
<ul>
<li><code>public</code> - <code>memory</code> 完全可见</li>
<li><code>private</code> 对本合约可见</li>
<li><code>internal</code> - <code>storage</code> 成员变量 定义时需要赋值 对继承自合约可见</li>
</ul>
<h3>合约函数的交易属性</h3>
<ul>
<li><code>view</code> 合约状态读操作</li>
<li><code>pure</code> 与合约状态无关的函数</li>
<li>默认是写操作 全网广播，共识确认</li>
</ul>
<h3>合约的基本结果</h3>
<ul>
<li>合约中的成员变量</li>
<li>合约中的成员函数</li>
<li><code>event</code> <code>modifier</code> <code>constructor</code></li>
</ul>
<h3>上下文变量</h3>
<ul>
<li>合约函数的背后是 <code>transaction</code>，上下文变量访问的是 <code>transaction</code>中的信息</li>
<li>两个上下文变量：<code>tx</code>和 <code>msg</code></li>
</ul>
<h3>合约之间的函数调用</h3>
<ul>
<li><code>EOA external owned account</code> 外部账号 例如 <code>metamask</code></li>
<li>调用最终总是由 <code>EOA</code>发起</li>
<li>合约之间的调用使得一次完整的调用成为一个调用链条</li>
</ul>
<h3>合约间调用过程</h3>
<ul>
<li>调用者须持有被调用合约的地址</li>
<li>得到 <strong>被调用合约的信息</strong></li>
<li>将地址重载为被调用合约，调用它的函数</li>
</ul>
<h4>源文件之间</h4>
<ul>
<li><code>import</code>被调用合约的源文件</li>
<li>调用者将被调用合约的地址重载为合约实例</li>
<li>用合约实例调用合约函数</li>
</ul>
<h3><code>ABI</code></h3>
<ol>
<li><code>EOA</code>使用的 <code>ABI</code>数据域合约间调用时调用者持有的接口是等价的，都是对合约函数签名的完整描述</li>
<li>调用者使用 <code>ABI</code>数据生成 <code>message</code>中的 <code>calldata</code></li>
</ol>
<h3><code>transaction</code>和 <code>block</code></h3>
<p>任何合约函数调用最终都是由一个 <code>EOA</code>发起一个 <code>transaction</code>触发，并通过合约之间的进一步调用形成一个调用链条。无论这个链条有多长，任何环节的函数都能够看到、访问这个链条的发起者 <code>transaction</code>，它是一个完整调用链条的全局性上下文变量，变量名称 <code>tx</code>。<code>transaction</code>总是来自于一个区块，这个区块对应的上下文变量的名称是 <code>block</code>。</p>
<h3><code>message</code>上下文的变化</h3>
<ol>
<li>合约之间的调用也模拟 <code>transaction</code>的结构，并且叫 <code>message</code>，变量名 <code>msg</code>。</li>
<li>直接被外部账号调用使用的 <code>message</code>可以认为是 <code>transaction</code>的一个拷贝</li>
<li><code>message</code>在合约间调用时新产生。调用链条中，合约内部调用看到的是一个 <code>message</code>，不同合约看到不同的 <code>message</code>。</li>
</ol>
<h3><code>external</code></h3>
<ul>
<li>函数 <code>should</code>应该只被外部函数调用</li>
<li>可以被内部调用，但是这种内部调用也有外部调用机制，即新产生 <code>message</code></li>
</ul>
<h3><code>call</code>函数</h3>
<p><code>(bool success, bytes data) = &lt;address&gt;.call(bytes calldata)</code></p>
<ul>
<li><code>call</code>是 <code>address</code>的方法</li>
<li><code>call</code>返回值 <code>(bool success, bytes data)</code></li>
<li><strong>忽视返回值 <code>success</code>，会造成严重问题</strong></li>
<li><code>call</code>函数是运行时动态生成 <code>calldata</code>，并未用到静态 <code>ABI</code>数据，但 <code>encodeWithSignature</code>中函数签名字符串和参数列表信息，与 <code>ABI</code>、接口等价、等量。</li>
</ul>
<h4><code>calldata</code>结构</h4>
<ul>
<li><code>call</code>参数是 <code>calldata</code></li>
<li><code>calldata</code>的前四个字节是 <code>selector</code>，剩下的是参数编码</li>
<li><code>selector = bytes4(keccak256(&lt;sig&gt;))</code></li>
<li><code>keccak256</code>：哈希 <code>sha3-&gt;256</code></li>
</ul>
<h4><code>Abi</code>工具函数</h4>
<ul>
<li><code>calldata = abi.encodeWithSignature(sig, ps)</code></li>
<li>返回值解码 <code>abi.decode(bytes)</code></li>
</ul>
<h4><code>fallback</code></h4>
<ul>
<li>动态调用 <code>call</code>绕过类型检查，或者自定义一个接口函数，但是这个函数并不存在，<code>fallback</code>才有机会起作用</li>
<li><code>proxy</code>模式中有重要应用：<code>delegatecall</code> 支持合约升级</li>
<li>转账功能中有重要作用</li>
</ul>
<h2><code>delegatecall</code>与代理模式</h2>
<blockquote>
<p>一个合约有成员变量，每个成员变量根据它的类型占有固定长度的空间并按照规则堆叠上去。这个成员变量序列的布局是固定的，每个成员变量的位置是固定的。<strong>合约编译成的机器码是用这个位置来访问它。在幕后，合约机器代码只认位置，不认变量名称。</strong></p>
</blockquote>
<h3><code>storage layout</code>存储布局</h3>
<p>成员变量按照它们出现的顺序在 <code>storage</code>中按照一种规则依次堆放，这使得每个成员变量具有固定的位置。在 <code>slot</code>中一个变量从低位开始存放。</p>
<h4>值类型堆叠规则</h4>
<ol>
<li>值类型需要的空间就是这个数据类型的数据块大小（字节）</li>
<li>值类型数据如果不能在当前 <code>slot</code>剩余空间存得下，则新起一个 <code>slot</code></li>
<li>结构和数组不会与其他数据分享 <code>slot</code>，之前或之后</li>
</ol>
<h4>动态数组和映射</h4>
<ol>
<li>动态数组和 <code>mapping</code>参与成员变量的堆叠占有一个 <code>32</code>位 <code>slot</code>，但数据通过哈希运算存在别的存储 <code>slot</code>中，不参与堆叠</li>
<li>动态数组的 <code>slot</code>存放数组大小，<code>mapping</code>空着</li>
</ol>
<h4><code>layout</code>中的递归与继承</h4>
<ol>
<li><code>struct</code>和 <code>array</code>数据的堆叠跟成员变量的堆叠规则一致</li>
<li>对于合约继承，按照 <code>c3</code>线性化的结果依次堆叠，并允许父子数据共存于一个 <code>slot</code></li>
<li><code>layout</code>规则并不是内部技术，而是与语言的外部行为有关</li>
</ol>
<h3><code>delegatecall</code></h3>
<ul>
<li><code>&lt;address&gt;.delegatecall(bytes calldata)</code></li>
<li>调用别的合约的代码，访问自己的成员</li>
</ul>
<h4>上下文变化</h4>
<ul>
<li><code>contractB</code>完全运行在 <code>contractA</code>的上下文中，<code>this msg.sender msg.value</code>均无变化，<code>msg</code>就是 <code>contractA</code>的调用者产生的 <code>message</code></li>
<li>合约调用链条中，<code>delegatecall</code>是调用者合约管辖范围的扩大</li>
</ul>
<h4>代理模式工作机制</h4>
<ol>
<li>调用者调用 <code>proxy</code>的 <code>setX()</code></li>
<li><code>proxy</code>的 <code>setX()</code>不存在，<code>fallback()</code>触发</li>
<li><code>fallback</code>使用 <code>delegatecall</code>调用 <code>logic</code>，将 <code>setX()</code>调用的 <code>calldata</code>传入</li>
<li><code>logic</code>的 <code>setX()</code>被执行，但访问的是 <code>proxy</code>的 <code>x</code>成员</li>
</ol>
<h4>升级</h4>
<ol>
<li>代理模式中，<code>proxy</code>负责数据存储，<code>logic</code>负责数据的逻辑处理</li>
<li>升级就是 <code>proxy</code>将它的 <code>logic</code>成员变量切换到一个新的处理逻辑</li>
</ol>
<h3><code>unstructured</code></h3>
<ol>
<li><code>proxy</code>提供空白存储，对存储的解释权完全由 <code>logic</code>负责，数据与逻辑分离</li>
<li>让 <code>proxy</code>中的 <code>logic</code>不参与 <code>storage</code>成员的堆叠，也就不必在 <code>logic</code>中出现 <code>placeholder</code></li>
<li><code>proxy</code>成为通用的、纯粹的代理，只安排代理控制逻辑，跟具体业务无关，而 <code>logic</code>成为纯粹干净的业务逻辑，跟代理机制无关</li>
</ol>
<h2>库合约</h2>
<ol>
<li>库定义 <code>library</code>关键字</li>
<li>不能继承别的合约，只能实现接口</li>
<li>不能有构造函数、成员变量、修饰器</li>
<li>库函数调用时合约内部调用，上下文不变化</li>
</ol>
<h3><code>public</code>与 <code>internal</code></h3>
<ul>
<li><code>public</code>或 <code>external</code>库函数是通过 <code>delegatecall</code>调用，但是调用的参数约束与内部调用相同</li>
<li><code>internal</code>是通过编译时代码内联实现</li>
<li>一个库如果含有 <code>public</code>函数必然要单独部署，其地址通过编译时嵌入或部署时作为部署参数传入</li>
</ul>
<h2>多重继承</h2>
<ol>
<li>线性化与函数覆盖 <code>override</code></li>
<li>多重继承中，某个合约的所有父合约集合中，合约与合约之间的继承关系构成了一个图结构，需要一种图的遍历算法来将这个图输出位一个线性结构。</li>
<li>存储布局的堆叠、构造函数的执行顺序、<code>super</code>关键字的定义都依赖于这个结构。</li>
</ol>
<h3>继承</h3>
<ol>
<li>继承定义 <code>is</code>关键字</li>
<li>变量与函数、<code>modifier</code>、<code>event</code>的可见性</li>
<li>构造函数</li>
<li>继承中父子关系式确定的</li>
<li>被继承的多个直接父合约之间用 <code>more-abstact-like</code> <code>to</code> <code>more-drived</code>也是确定的</li>
<li>父在子前，兄在弟前，得出的排列顺序是确定的 <code>deterministic</code></li>
</ol>
<h4>继承的实现方式</h4>
<ol>
<li>继承的实现方案是代码拷贝，合约继承后，部署到线上时，将变成一个合约。代码将从父合约拷贝到子合约中</li>
</ol>
<h3>多态</h3>
<ol>
<li><code>virtual</code>与 <code>override</code>关键字</li>
<li>可见性与 <code>mutability</code>的约束</li>
<li><code>abstract</code>关键字 修饰合约</li>
</ol>
<h3><code>c3</code>线性序列化算法</h3>
<ol>
<li>从当前合约开始找父合约，并且是从右向左遍历</li>
<li><strong>如果找到的合约的子合约都被遍历过</strong>，该合约入列，否则回退一步，找兄合约（左侧合约）</li>
<li>合约结束遍历，输出遍历顺序，并且倒置</li>
</ol>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
