      <noscript><div class="markdown-content viewer" style="padding:1em"><h2>双 <code>Token</code> 认证系统</h2>
<ol>
<li><code>Access Token</code>（访问令牌）<ul>
<li><strong>用途</strong>：用于访问受保护的 <code>API</code> 资源，附加在每个请求的 <code>Header</code> 中</li>
<li><strong>特点</strong>：生命周期短（1小时），无状态，服务器无需存储</li>
<li><strong>存储</strong>：通常存储在客户端内存中，需要频繁读取</li>
</ul>
</li>
<li><code>Refresh Token</code>（刷新令牌）<ul>
<li><strong>用途</strong>：当 <code>Access Token</code> 过期时，专门用于获取一个新的 <code>Access Token</code></li>
<li><strong>特点</strong>：生命周期长（7天或30天），与特定用户绑定，服务器需要安全存储其有效性记录</li>
<li><strong>存储</strong>：必须安全存储。<strong>最佳实践时存储在 <code>HttpOnly Cookie</code> 中</strong>，可以防止客户端 <code>JavaScript</code>（<code>XSS</code>攻击） 脚本读取</li>
</ul>
</li>
</ol>
<p><code>Access Token</code>无状态，服务器无需记录，<code>JWT</code>无法主动吊销，<code>Refresh Token</code>有状态，服务器需要一个列表记录，当用户更改密码或主动登出时，服务器可以主动将对应的 <code>Refresh Token</code>设为无效。</p>
<h2>加密方式</h2>
<p><strong><code>md5 hash + salt</code></strong></p>
<p><code>salt</code>在密码学中是指在 <code>hash</code>之前将明文内容的任意固定位置插入特定的字符串。</p>
<p><strong><code>bcrybt</code></strong></p>
<p>一种加盐（<code>salt</code>）的单向 <code>hash</code>，不可逆的加密算法，同一种明文 <code>plaintext</code>，每次加密后的密文都不一样，而且不可反向破解生成明文，破解难度很大。</p>
<h2><code>Cookie</code></h2>
<p><strong>生命周期</strong></p>
<pre><code class="language-cookie">Set-Cookie: id=a3fWa; Expires=Thu, 18 Dec 2013 12:00:00 GMT;
</code></pre>
<p><strong><code>cookie</code>安全性</strong></p>
<ul>
<li><code>Secure</code>：只通过被 <code>https</code>协议加密过的请求发送给服务端</li>
<li><code>HttpOnly</code>：无法使用 <code>javaScript</code> 对它进行访问。key有效缓解 <code>xss</code>攻击</li>
<li><code>document.cookie</code> 无法访问到对应的数据</li>
</ul>
<pre><code class="language-cookie">Set-Cookie: id=a3fWa; Expires=Thu, 18 Dec 2013 12:00:00 GMT; Secure; HttpOnly;
</code></pre>
<p><strong>作用域</strong></p>
<ul>
<li><code>Domain</code>：指定了哪些主机可以接受 <code>cookie</code>，如果不指定，默认为 <code>origin</code>，不包括子域名</li>
<li><code>Path</code>：标识指定了主机下的哪些路径可以接受 <code>cookie</code></li>
</ul>
<p><strong><code>SameSite</code></strong>
<code>SameSite Cokie</code>允许服务器要求某个 <code>cookie</code>在跨站请求时不会被发送，可以阻止跨站请求伪造攻击（<code>Cross-Site Request Forgery</code>，简称 <code>CSRF</code>）。</p>
<p><code>None</code> <code>Stict</code> <code>Lax</code></p>
<h2>授权和认证</h2>
<ul>
<li>授权 <code>Authorization</code> 认证 <code>Authentication</code></li>
<li><strong>用户认证</strong>指的是使用用户名、密码来验证当前用户的身份<ul>
<li>用户登录</li>
<li>错误状态码 <code>401 Unauthorized</code> 未授权</li>
</ul>
</li>
<li><strong>用户授权</strong>指当前用户有足够的权限访问特定的资源<ul>
<li>错误状态码 <code>403 Forbidden</code> 禁止访问</li>
</ul>
</li>
</ul>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
