      <noscript><div class="markdown-content viewer" style="padding:1em"><h1><code>Docker</code>部署</h1>
<blockquote>
<ol>
<li><strong>安装 <code>Docker</code></strong>
<code>dnf</code> 添加 <code>docker-ce</code> 阿里云源并安装，启停</li>
<li><strong>获取镜像</strong>
拉取 <code>ghcr.io</code> 官方镜像；拉不动则 <code>git clone</code> 后本地 <code>docker build</code></li>
<li><strong>运行容器</strong>
<code>-p 80:80</code>，配置 <code>METING_URL / METING_TOKEN</code> 环境变量</li>
<li><strong>放行端口</strong>
阿里云安全组 + <code>firewalld</code> 放行 <code>80</code></li>
<li><strong>验证</strong>
<code>curl</code> 访问 <code>/api?server=netease&amp;type=search</code></li>
</ol>
</blockquote>
<h2>第 1 步：安装 <code>Docker</code>（阿里云官方源）</h2>
<pre><code class="language-sh"># 1) 添加 docker-ce 源（用 curl，阿里云内网镜像）
sudo curl -o /etc/yum.repos.d/docker-ce.repo http://mirrors.cloud.aliyuncs.com/docker-ce/linux/centos/docker-ce.repo
sudo sed -i &#39;s|https://mirrors.aliyun.com|http://mirrors.cloud.aliyuncs.com|g&#39; /etc/yum.repos.d/docker-ce.repo

# 2) 关键：Alibaba Cloud Linux 3 的 $releasever=3，docker-ce 源按 CentOS 8 组织，
#    手动把变量替换成 8（等价于 releasever-adapter 插件的作用）
sudo sed -i &#39;s|\$releasever|8|g&#39; /etc/yum.repos.d/docker-ce.repo

# 3) 刷新缓存并安装
sudo dnf clean all
sudo dnf -y install docker-ce docker-ce-cli containerd.io docker-compose-plugin

# 4) 启动并验证
sudo systemctl enable --now docker
docker --version
</code></pre>
<h2>第 2 步：获取镜像</h2>
<p>拉取<a href="https://github.com/whjin/Meting-API">Github仓库代码</a>本地构建</p>
<pre><code class="language-sh">sudo dnf -y install git
git clone https://github.com/whjin/Meting-API.git /opt/meting-api   # 慢可换 https://ghfast.top/https://github.com/...
cd /opt/meting-api
docker build -t meting-api .
</code></pre>
<p><strong>配置 <code>Docker</code> 镜像加速器</strong></p>
<pre><code class="language-sh"># 1) 创建配置
sudo mkdir -p /etc/docker
sudo tee /etc/docker/daemon.json &lt;&lt;&#39;EOF&#39;
{
  &quot;registry-mirrors&quot;: [&quot;https://docker.m.daocloud.io&quot;]
}
EOF



# 2) 重启 Docker 生效
sudo systemctl daemon-reload
sudo systemctl restart docker

# 3) 重新构建
cd /opt/meting-api    # 或你 clone 的 meting-api 目录
docker build -t meting-api .
</code></pre>
<p><strong>临时用公共加速器</strong>：<code>&quot;registry-mirrors&quot;: [&quot;https://docker.m.daocloud.io&quot;]</code></p>
<p><strong><a href="https://cr.console.aliyun.com/cn-shenzhen/instances/mirrors">阿里云加速器地址</a>获取</strong> （ECS 用户最稳）：登录阿里云控制台 → 搜索 &quot;容器镜像服务 ACR&quot; → 左侧 &quot;镜像工具 → 镜像加速器&quot;，页面会显示你账号专属的加速地址（形如 <code>https://xxxx.mirror.aliyuncs.com</code>），复制填到上面配置里即可。</p>
<h2>第 3 步：运行容器</h2>
<pre><code class="language-sh"># 1) 删掉旧容器（-f 强制，保险）
docker rm -f meting-api

# 2) 重新运行（METING_URL 记得带 :8000）
docker run -d --name meting-api \
  -p 80:80 \
  -e METING_URL=http://你的服务器公网IP:8000 \
  -e METING_TOKEN=换成你自己的随机密钥 \
  --restart unless-stopped \
  ghcr.io/metowolf/meting-api:latest
</code></pre>
<p><strong>随机密钥生成方式：</strong><code>openssl rand -hex 32</code></p>
<h2>第 4 步：放行端口</h2>
<ol>
<li><strong>阿里云安全组</strong>：ECS 控制台 → 实例 → 安全组 → 入方向规则 → 添加 80 端口（或你自定义的端口, 例如 8000），授权对象 <code>0.0.0.0/0</code></li>
<li><strong>系统防火墙</strong>：</li>
</ol>
<pre><code class="language-sh">sudo firewall-cmd --permanent --add-port=8000/tcp &amp;&amp; sudo firewall-cmd --reload
# 如果没开 firewalld 可忽略
</code></pre>
<p><code>80</code> 端口被占用，可尝试 <code>8000</code> 端口</p>
<h2>第 5 步：验证</h2>
<pre><code class="language-sh"># 本机验证
curl &quot;http://localhost:8000/api?server=netease&amp;type=search&amp;id=周杰伦&quot;
# 公网验证（在本地电脑浏览器打开）
http://你的公网IP:8000/api?server=netease&amp;type=search&amp;id=周杰伦
</code></pre>
<h1>完整命令</h1>
<pre><code class="language-sh"># 1) 删掉这个从未运行的旧容器
docker rm -f meting-api

# 2) 重新运行（这次会真正启动）
docker run -d --name meting-api \
  -p 80:80 \
  -e METING_URL=http://你的服务器公网IP:8000 \
  -e METING_TOKEN=换成你自己的随机密钥 \
  --restart unless-stopped \
  ghcr.io/metowolf/meting-api:latest

# 3) 确认状态（STATUS 必须是 Up，不能是 Created/Exited）
docker ps | grep meting-api

# 4) 本机测试（用 localhost，不要 curl 自己的公网 IP）
curl &quot;http://localhost:8000/api?server=netease&amp;type=search&amp;id=周杰伦&quot;
</code></pre>
<h1>IP地址映射为域名地址</h1>
<ol>
<li>在你的域名解析控制台添加一条 <strong>A 记录</strong></li>
<li>在服务器 <code>/etc/nginx/conf.d/meting.conf</code> 中配置反向代理，包括 <code>HTTP</code> 和 <code>HTTPS</code></li>
<li>重载 Nginx 配置</li>
</ol>
<pre><code class="language-sh">sudo systemctl -s reload nginx
</code></pre>
<ol start="4">
<li>重新安装证书</li>
</ol>
<pre><code class="language-sh">certbot install --cert-name meting.wuhuajin.com
</code></pre>
<ol start="5">
<li>验证</li>
</ol>
<pre><code class="language-sh"># 查看 Nginx 配置是否已经被 certbot 修改
cat /etc/nginx/conf.d/meting.wuhuajin.com.conf

# 测试 HTTPS 是否通
curl -I https://meting.wuhuajin.com/api?server=netease&amp;type=search&amp;id=周杰伦
</code></pre>
<ol start="6">
<li>更新 Docker 容器的 <code>METING_URL</code></li>
</ol>
<pre><code class="language-sh">docker rm -f meting-api
docker run -d --name meting-api \
  -p 8000:80 \
  -e METING_URL=https://meting.wuhuajin.com \
  -e METING_TOKEN=你的密钥 \
  --restart unless-stopped \
  meting-api
</code></pre>

  <script>
    (function () {
      /* 静态页滚动容器抗注入：部分预览环境会对 .layout-container/.content-area 整段 setAttribute style 为
         "height: auto !important"，使内部滚动容器按内容高度解析、滚不到底。
         用 MutationObserver 侦测 style 属性变化，一旦出现 auto 即用 JS 计算的视口像素高度（window.innerHeight，
         不受 100vh 被内容撑大的影响）重新施加，恢复 631 内部滚动。生产正常浏览器无注入时不触发。 */
      var l = document.querySelector('.layout-container');
      var ca = document.querySelector('.content-area');
      if (!l || !ca) return;
      function fixedH() {
        var b = parseInt(window.getComputedStyle(document.body).getPropertyValue('--banner-height')) || 0;
        return (window.innerHeight - b) + 'px';
      }
      function force() {
        var h = fixedH();
        var changed = false;
        if ((l.getAttribute('style') || '').indexOf('auto') !== -1) {
          l.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        if ((ca.getAttribute('style') || '').indexOf('auto') !== -1) {
          ca.setAttribute('style', 'height:' + h + ';');
          changed = true;
        }
        return changed;
      }
      var timer = null;
      var mo = new MutationObserver(function () {
        if (timer) clearTimeout(timer);
        timer = setTimeout(force, 50);
      });
      mo.observe(l, { attributes: true, attributeFilter: ['style'] });
      mo.observe(ca, { attributes: true, attributeFilter: ['style'] });
      window.addEventListener('resize', force);
      force();
    })();
  </script>
